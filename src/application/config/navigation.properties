# ============================================================
# Application Navigation Configuration
# ============================================================
#
# This file contains navigation configuration owned by the
# concrete Application.
#
# Template features are configured in features.properties.
# Reusable Template navigation structure and internal menu IDs
# remain owned by the Base Template.
#
# Detailed architecture documentation:
# doc/architecture/application-navigation.md
# ============================================================


# ------------------------------------------------------------
# Navigation Root Mode
# ------------------------------------------------------------
#
# Controls how Application navigation and reusable Template
# settings navigation are composed.
#
# Supported values:
#
# split
#   Application navigation and Template settings may use
#   separate navigation roots.
#
# unified
#   Application navigation and Template settings are composed
#   below the semantic Application root "applicationRoot".
#
# If this property is omitted, "split" is used by default.
#
# Example for a unified Application:
#
# NavigationRootMode=unified
#
# menu.applicationRoot.enabled=true
# menu.applicationRoot.caption=application
# menu.applicationRoot.position=1
# menu.applicationRoot.screen=home-screen
#
# Application-owned children can then use:
#
# menu.home.parent=applicationRoot
#
# Concrete Applications should prefer semantic Application
# relationships such as "applicationRoot" instead of depending
# on internal Template navigation IDs.
# ------------------------------------------------------------

NavigationRootMode=split


# ------------------------------------------------------------
# Example Application
# ------------------------------------------------------------
#
# This existing in-repository example currently extends the
# traditional Template settings navigation while split mode is
# active.
#
# New consumer Applications that require their own navigation
# root should use "applicationRoot" as documented above.
# ------------------------------------------------------------

menu.example.enabled=true
menu.example.caption=exampleApplication
menu.example.parent=settings
menu.example.position=99
menu.example.screen=example-screen