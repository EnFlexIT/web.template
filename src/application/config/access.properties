# ============================================================
# Template Access Configuration
# ============================================================
#
# Defines which effective roles may access Template features.
#
# Supported effective roles:
#
#   user
#   frontendEditor
#   backendEditor
#
# superAdmin is intentionally NOT configured here.
#
# A superAdmin receives all effective roles at runtime:
#
#   user
#   frontendEditor
#   backendEditor
#
# Access rules are inherited through the semantic feature
# hierarchy. A child may further restrict its parent, but it
# must not re-enable a role that its parent excluded.
#
# Missing access rules do not introduce an additional
# restriction.
# ============================================================


# ------------------------------------------------------------
# Settings
# ------------------------------------------------------------

access.settings.roles=user,frontendEditor,backendEditor

access.settings.notifications.roles=user,frontendEditor,backendEditor


# ------------------------------------------------------------
# Personal Settings
# ------------------------------------------------------------

access.personalSettings.roles=user,frontendEditor,backendEditor

access.personalSettings.appearance.roles=user,frontendEditor,backendEditor
access.personalSettings.privacy.roles=user,frontendEditor,backendEditor
access.personalSettings.userProfile.roles=user,frontendEditor,backendEditor
access.personalSettings.changePassword.roles=user,frontendEditor,backendEditor


# ------------------------------------------------------------
# System Settings
# ------------------------------------------------------------

access.systemSettings.roles=frontendEditor,backendEditor

access.systemSettings.serverSettings.roles=backendEditor
access.systemSettings.settingsFileUpload.roles=backendEditor
access.systemSettings.liveConsole.roles=backendEditor


# ------------------------------------------------------------
# Update
# ------------------------------------------------------------

access.systemSettings.update.roles=frontendEditor,backendEditor

access.systemSettings.update.general.roles=frontendEditor,backendEditor
access.systemSettings.update.webapp.roles=frontendEditor
access.systemSettings.update.backend.roles=backendEditor


# ------------------------------------------------------------
# Agent.Workbench
# ------------------------------------------------------------

access.systemSettings.programStart.roles=backendEditor
access.systemSettings.dataAnalyzing.roles=backendEditor


# ------------------------------------------------------------
# Database
# ------------------------------------------------------------

access.systemSettings.database.roles=backendEditor

access.systemSettings.database.general.roles=backendEditor
access.systemSettings.database.factory.roles=backendEditor
access.systemSettings.database.derby.roles=backendEditor