# ============================================================
# Base Template Access Configuration
# ============================================================
#
# Defines role-based access for Base Template features.
#
# Supported Base Template roles:
#
#   USER
#   EDITOR
#   ADMIN
#
# These roles are backend roles.
#
# EDITOR and ADMIN are currently used only to control access
# to the Base Template system settings.
#
# Application-specific frontend roles are intentionally not
# defined here. They will later be supplied separately by the
# concrete Application / database / REST API.
#
# Access rules are inherited through the semantic feature
# hierarchy.
#
# Missing access rules do not introduce an additional
# restriction.
# ============================================================


# ------------------------------------------------------------
# System Settings
# ------------------------------------------------------------
#
# USER must not access system settings.
#
# EDITOR and ADMIN may access system settings.
#
# More specific child restrictions can be added later when
# the exact EDITOR / ADMIN permission matrix is defined.
# ------------------------------------------------------------

access.systemSettings.roles=EDITOR,ADMIN

# ------------------------------------------------------------
# Data Analyzing
# ------------------------------------------------------------
#
# Demo restriction:
#
# ADMIN may access Data Analyzing.
# EDITOR inherits system settings access but is excluded from
# this more specific child feature.
# ------------------------------------------------------------

access.systemSettings.dataAnalyzing.roles=ADMIN
