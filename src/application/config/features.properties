# ============================================================
# Template Feature Configuration
# ============================================================
#
# A concrete Application only decides which features of the
# Base Template it wants to use.
#
# Internal menu IDs, parent IDs, screen registry keys and
# runtime visibility rules are owned by the Base Template.
# ============================================================


# ------------------------------------------------------------
# General Settings
# ------------------------------------------------------------

feature.notifications.enabled=true


# ------------------------------------------------------------
# Personal Settings
# ------------------------------------------------------------

feature.appearance.enabled=true
feature.privacy.enabled=true
feature.userProfile.enabled=true
feature.changePassword.enabled=true


# ------------------------------------------------------------
# System Settings
# ------------------------------------------------------------

feature.serverSettings.enabled=true
feature.settingsFileUpload.enabled=true
feature.liveConsole.enabled=true


# ------------------------------------------------------------
# Update
# ------------------------------------------------------------

feature.update.general.enabled=true
feature.update.webapp.enabled=true
feature.update.backend.enabled=true


# ------------------------------------------------------------
# Agent.Workbench
# ------------------------------------------------------------

feature.programStart.enabled=true
feature.dataAnalyzing.enabled=true


# ------------------------------------------------------------
# Database
# ------------------------------------------------------------

feature.database.general.enabled=true
feature.database.factory.enabled=true
feature.database.derby.enabled=true


# ------------------------------------------------------------
# Development
# ------------------------------------------------------------

feature.devHome.enabled=false