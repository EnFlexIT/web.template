# ============================================================
# Template Feature Configuration
# ============================================================
#
# A concrete Application only decides which features of the
# Base Template it wants to use.
#
# Feature names follow a semantic hierarchy.
#
# A disabled parent feature disables all features below it,
# even if a child feature is explicitly enabled.
#
# Internal menu IDs, parent IDs, screen registry keys and
# runtime visibility rules are owned by the Base Template.
# ============================================================


# ------------------------------------------------------------
# Settings
# ------------------------------------------------------------

feature.settings.enabled=true

feature.settings.notifications.enabled=true
feature.settings.devHome.enabled=false


# ------------------------------------------------------------
# Personal Settings
# ------------------------------------------------------------

feature.personalSettings.enabled=true

feature.personalSettings.appearance.enabled=true
feature.personalSettings.privacy.enabled=true
feature.personalSettings.userProfile.enabled=true
feature.personalSettings.changePassword.enabled=true


# ------------------------------------------------------------
# System Settings
# ------------------------------------------------------------

feature.systemSettings.enabled=true

feature.systemSettings.serverSettings.enabled=true
feature.systemSettings.settingsFileUpload.enabled=true
feature.systemSettings.liveConsole.enabled=true


# ------------------------------------------------------------
# Update
# ------------------------------------------------------------

feature.systemSettings.update.enabled=true

feature.systemSettings.update.general.enabled=true
feature.systemSettings.update.webapp.enabled=true
feature.systemSettings.update.backend.enabled=true


# ------------------------------------------------------------
# Agent.Workbench
# ------------------------------------------------------------

feature.systemSettings.programStart.enabled=true
feature.systemSettings.dataAnalyzing.enabled=true


# ------------------------------------------------------------
# Database
# ------------------------------------------------------------

feature.systemSettings.database.enabled=true

feature.systemSettings.database.general.enabled=true
feature.systemSettings.database.factory.enabled=true
feature.systemSettings.database.derby.enabled=true
