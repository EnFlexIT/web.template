# ============================================================
# Template Menu Configuration
# ============================================================
#
# Defines the availability and access restrictions of
# the Base Template menus.
#
# A disabled parent menu disables all its child menus.
#
# Access restrictions are inherited from parent menus.
# A child menu may further restrict access.
#
# Supported roles:
#   USER
#   EDITOR
#   ADMIN
#
# Missing access rules introduce no additional restrictions.
#
# Internal menu IDs, screen mappings and runtime rules
# remain managed by the Base Template.
# ============================================================


# ============================================================
# Settings
# ============================================================

settings.enabled=true


# ------------------------------------------------------------
# Notifications
# ------------------------------------------------------------

settings.notifications.enabled=true


# ------------------------------------------------------------
# Developer Home
# ------------------------------------------------------------

settings.devHome.enabled=false


# ============================================================
# Personal Settings
# ============================================================

settings.personalSettings.enabled=true

settings.personalSettings.appearance.enabled=true
settings.personalSettings.privacy.enabled=true
settings.personalSettings.userProfile.enabled=true
settings.personalSettings.changePassword.enabled=true


# ============================================================
# System Settings
# ============================================================

settings.systemSettings.enabled=true
access.settings.systemSettings.roles=EDITOR,ADMIN


# ------------------------------------------------------------
# General System Settings
# ------------------------------------------------------------

settings.systemSettings.serverSettings.enabled=true
settings.systemSettings.settingsFileUpload.enabled=true
settings.systemSettings.liveConsole.enabled=true


# ------------------------------------------------------------
# Update
# ------------------------------------------------------------

settings.systemSettings.update.enabled=true

settings.systemSettings.update.general.enabled=true
settings.systemSettings.update.webapp.enabled=true
settings.systemSettings.update.backend.enabled=true


# ------------------------------------------------------------
# Agent.Workbench
# ------------------------------------------------------------

settings.systemSettings.programStart.enabled=true

settings.systemSettings.programStart.dataAnalyzing.enabled=true
access.settings.systemSettings.programStart.dataAnalyzing.roles=ADMIN


# ------------------------------------------------------------
# Database
# ------------------------------------------------------------

settings.systemSettings.database.enabled=true

settings.systemSettings.database.general.enabled=true
settings.systemSettings.database.factory.enabled=true
settings.systemSettings.database.derby.enabled=true
