# ============================================================
# Application Navigation Feature Flags
# ============================================================
#
# Menu visibility:
#
# feature.menu.<menuId>.enabled=true|false
# feature.menu.<menuId>.authInclude=<methods>
# feature.menu.<menuId>.authExclude=<methods>
#
# "unset" represents an authentication method that has not
# been resolved yet.
#
# Tab visibility:
#
# feature.tab.<featureId>.enabled=true|false
#
# For state-dependent features:
#
# feature.tab.<featureId>.type=stateEquals
# feature.tab.<featureId>.statePath=<state path>
# feature.tab.<featureId>.value=<expected value>
# ============================================================


# ------------------------------------------------------------
# Menu
# ------------------------------------------------------------

feature.menu.3011.enabled=false
feature.menu.3012.enabled=true
feature.menu.3013.enabled=true
feature.menu.3014.enabled=true
feature.menu.3010.enabled=true
feature.menu.3024.enabled=true
feature.menu.3025.enabled=true

# Change Password is not available with OIDC.
feature.menu.3013.authExclude=oidc

# User Profile is available for OIDC or before the
# authentication method has been resolved.
feature.menu.3025.authInclude=oidc,unset


# ------------------------------------------------------------
# Tabs
# ------------------------------------------------------------

feature.tab.5001.enabled=true

feature.tab.3111.enabled=true

# Data Analyzing is available only when Agent.Workbench
# is running as SERVER_MASTER.
feature.tab.3000.type=stateEquals
feature.tab.3000.statePath=execSettings.appliedStartAs
feature.tab.3000.value=SERVER_MASTER