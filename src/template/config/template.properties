# ------------------------------------------------------------
# Current Base Template Release Notes
# ------------------------------------------------------------
#
# These notes belong to TemplateVersion and are shipped with
# the Base Template so concrete Applications can display them.
# ------------------------------------------------------------

TemplateReleaseNote.1=Rollenbasierte Zugriffssteuerung für Menüs, Tabs und Routen wurde ergänzt.
TemplateReleaseNote.2=Die Base-Template-Rollen USER, EDITOR und ADMIN unterstützen jetzt unterschiedliche sichtbare Bereiche.
TemplateReleaseNote.3=ADMIN kann mit der Role Preview die Anwendung aus Sicht von USER oder EDITOR prüfen.
TemplateReleaseNote.4=Zugriffsregeln können über access.properties hierarchisch für Template-Features definiert werden.
TemplateReleaseNote.5=Untergeordnete Features können strengere Zugriffsregeln als ihr übergeordnetes Feature erhalten.
TemplateReleaseNote.6=Als Beispiel ist Data Analyzing nur für ADMIN sichtbar, während EDITOR weiterhin auf die übrigen System Settings zugreifen kann.
TemplateReleaseNote.7=Bei einem Rollenwechsel wird automatisch auf einen weiterhin erlaubten Bereich weitergeleitet.
TemplateReleaseNote.8=Authorization-Logik und Generatorverhalten sind durch automatisierte Tests abgesichert.
TemplateReleaseNote.9=Die Architektur ist für eine spätere Rollen- und Permission-Übernahme aus dem Backend vorbereitet.
