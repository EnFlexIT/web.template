# ------------------------------------------------------------
# Versioned Base Template Release History
# ------------------------------------------------------------

TemplateRelease.0.0.10.Note.1=Rollenbasierte Zugriffssteuerung für Menüs, Tabs und Routen wurde ergänzt.
TemplateRelease.0.0.10.Note.2=Die Base-Template-Rollen USER, EDITOR und ADMIN unterstützen jetzt unterschiedliche sichtbare Bereiche.
TemplateRelease.0.0.10.Note.3=ADMIN kann mit der Role Preview die Anwendung aus Sicht von USER oder EDITOR prüfen.
TemplateRelease.0.0.10.Note.4=Zugriffsregeln können über access.properties hierarchisch für Template-Features definiert werden.
TemplateRelease.0.0.10.Note.5=Untergeordnete Features können strengere Zugriffsregeln als ihr übergeordnetes Feature erhalten.
TemplateRelease.0.0.10.Note.6=Als Beispiel ist Data Analyzing nur für ADMIN sichtbar, während EDITOR weiterhin auf die übrigen System Settings zugreifen kann.
TemplateRelease.0.0.10.Note.7=Bei einem Rollenwechsel wird automatisch auf einen weiterhin erlaubten Bereich weitergeleitet.
TemplateRelease.0.0.10.Note.8=Authorization-Logik und Generatorverhalten sind durch automatisierte Tests abgesichert.
TemplateRelease.0.0.10.Note.9=Die Architektur ist für eine spätere Rollen- und Permission-Übernahme aus dem Backend vorbereitet.

TemplateRelease.0.0.9.Note.1="Was ist neu?" im Update-Bereich wurde erweitert und übersichtlicher gestaltet.
TemplateRelease.0.0.9.Note.2=Update-Prüfzeiten werden jetzt korrekt von UTC in die lokale Zeit des Benutzers umgerechnet.
TemplateRelease.0.0.9.Note.3=Abstände, Breiten und Inhaltsausrichtung im Update- und Developer-Tools-Bereich wurden vereinheitlicht.
